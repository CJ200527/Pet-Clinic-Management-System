<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vet - Pet Clinic{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/sidebar.css') }}" rel="stylesheet">
</head>
<body>
{% include "_sprite.html" %}
{% set ep = request.endpoint %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{{ url_for('vet_dashboard') }}">
      <svg class="ic" aria-hidden="true"><use href="#i-paw"></use></svg>
      <span>Paws &amp; Care</span>
    </a>
    <div class="profile">
      <div class="avatar">{{ (session.get('full_name') or '?')[:1] }}</div>
      <div><strong>{{ session.get('full_name', 'Vet') }}</strong><small>{{ session.get('role', '') }}</small></div>
    </div>
    <nav class="snav">
      <a href="{{ url_for('vet_dashboard') }}" class="{{ 'active' if ep in ('vet_dashboard',) else '' }}">
        <svg class="ic" aria-hidden="true"><use href="#i-dashboard"></use></svg><span>Dashboard</span></a>
      <a href="{{ url_for('vet_queue') }}" class="{{ 'active' if ep in ('vet_queue', 'vet_queue_status') else '' }}">
        <svg class="ic" aria-hidden="true"><use href="#i-queue"></use></svg><span>Queue</span></a>
      <a href="{{ url_for('vet_consultations') }}" class="{{ 'active' if ep in ('vet_consultations', 'vet_consultation_new', 'vet_consultation_detail') else '' }}">
        <svg class="ic" aria-hidden="true"><use href="#i-pulse"></use></svg><span>Consultations</span></a>
    </nav>
    <div class="side-foot">
      <a class="logout-btn" href="{{ url_for('logout') }}">
        <svg class="ic" aria-hidden="true"><use href="#i-logout"></use></svg><span>Logout</span></a>
    </div>
  </aside>
  <div class="main">
    <div class="mobilebar">
      <button id="navToggle" aria-label="Menu"><svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      <strong>Paws &amp; Care · Vet</strong>
    </div>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
</body>
</html>
