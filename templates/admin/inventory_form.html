{% extends "admin/base.html" %}
{% block title %}Edit Item - Pet Clinic{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h3>Edit: {{ item.item_name }}</h3>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <div class="alert alert-danger">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('admin_inventory_edit', item_id=item.id) }}">
        <div class="mb-2"><label class="form-label">Item name</label>
          <input type="text" name="item_name" value="{{ item.item_name }}" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Category</label>
          <select name="category" class="form-select">
            {% for c in categories %}<option value="{{ c }}" {% if c == item.category %}selected{% endif %}>{{ c }}</option>{% endfor %}
          </select></div>
        <div class="row">
          <div class="col-6 mb-2"><label class="form-label">Qty</label>
            <input type="number" name="quantity" value="{{ item.quantity }}" min="0" class="form-control"></div>
          <div class="col-6 mb-2"><label class="form-label">Price</label>
            <input type="number" name="price" value="{{ item.price }}" min="0" step="0.01" class="form-control"></div>
        </div>
        <div class="mb-3"><label class="form-label">Expiry</label>
          <input type="date" name="expiry_date" value="{{ item.expiry_date or '' }}" class="form-control"></div>
        <button class="btn btn-primary w-100">Save</button>
      </form>
      <a href="{{ url_for('admin_inventory') }}" class="btn btn-link mt-2">← Back</a>
    </div></div>
  </div></div>
</div>
{% endblock %}
